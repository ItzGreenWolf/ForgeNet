[package]
name = "forgenet"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
warp-json-rpc = "0.1"  # if available, else we'll use manual
rand = "0.8"